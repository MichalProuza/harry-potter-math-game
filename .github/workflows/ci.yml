name: Kontrola

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Testy a sestavení
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typová kontrola (hra i server)
        run: npm run typecheck
      - name: Testy herní logiky
        run: npm test
      - name: Sestavení hry
        run: npm run build
